[package]
name = "xiaozhou"
version = "0.6.0"
description = "小舟 — 桌面 AI 助手"
authors = ["hope"]
edition = "2021"

[lib]
name = "xiaozhou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "gzip",
  "http2",
  "charset",
] }
tokio = { version = "1", features = ["process", "time", "io-util", "rt", "macros"] }
futures-util = "0.3"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-opener = "2.7.2"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
